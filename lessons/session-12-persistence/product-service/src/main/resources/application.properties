# --- Database connection ---
# The Postgres container (see the docker run command in the lesson)
# listens on port 5432 on localhost. "shopsphere" is the database name we
# told Postgres to create on first startup; username/password match what
# we passed to `docker run` with -e POSTGRES_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/shopsphere
spring.datasource.username=postgres
spring.datasource.password=root

# --- Hibernate behavior ---
# "update": at startup, Hibernate compares your @Entity classes to the
# actual tables in the database and ALTERs/CREATEs whatever's missing to
# match. Convenient for learning - change a field, restart the app, the
# column just appears, no manual SQL. Real production systems do NOT use
# this (an unreviewed automatic schema change can silently corrupt real
# data) - they use a migration tool like Flyway or Liquibase instead,
# with explicit, version-controlled SQL scripts reviewed like any other
# code change. We're using "update" for now, deliberately, and will
# revisit this properly in a later session.
spring.jpa.hibernate.ddl-auto=update

# Prints every SQL statement Hibernate actually runs to the console, and
# formats it so it's readable. Turn this on while learning, so you can
# see the literal SQL hiding behind every repository call -
# productRepository.save(...), findByName(...), findAll(), all of it.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
